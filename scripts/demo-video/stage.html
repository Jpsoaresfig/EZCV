const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const E = {
  lin: (p) => p,
  out: (p) => 1 - Math.pow(1 - p, 3),
  in: (p) => p * p * p,
  io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: (p) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  expo: (p) => (p === 1 ? 1 : 1 - Math.pow(2, -10 * p))
};
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const tw = (t, a, b, v0, v1, e = E.out) => v0 + (v1 - v0) * e(prog(t, a, b));
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, on) => { el.style.display = on ? (el.classList.contains('scene') ? 'block' : '') : 'none'; };
const words = (el, arr) => { el.innerHTML = arr.map((w) => (w === '<br>' ? '<br>' : `<span class="w">${w}</span>`)).join(' '); return $$(`#${el.id} .w`); };

/* ---------- clips gravados ---------- */
function makeClip(c) {
  return { ...c, frameAt(ct) {
    const f = c.frames; let lo = 0, hi = f.length - 1;
    if (ct <= f[0][1]) return f[0][0];
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (f[m][1] <= ct) lo = m; else hi = m - 1; }
    return f[lo][0];
  }, m(name) { const x = c.markers[name]; if (!x) throw new Error('marcador em falta: ' + name); return x; } };
}
function showFrame(img, clip, ct) {
  const src = clip.frameAt(ct);
  if (img.dataset.src !== src) {
    img.dataset.src = src; img.src = src;
    pending.push(img.decode().catch(() => {}));
  }
}
/* Partes do clip [a,b] (tempo do clip) distribuídas por [s0,s1] (tempo do
 * vídeo). r = aceleração relativa: >1 passa mais depressa que as outras. */
function mapping(pieces, s0, s1) {
  const nat = pieces.map((p) => (p.b - p.a) / (p.r || 1));
  const k = (s1 - s0) / nat.reduce((x, y) => x + y, 0);
  let acc = s0;
  const segs = pieces.map((p, i) => { const d = nat[i] * k; const s = { ...p, s: acc, e: acc + d }; acc += d; return s; });
  return {
    segs,
    at(t) { // tempo do vídeo -> {ct, i}
      if (t <= s0) return { ct: segs[0].a, i: 0 };
      for (let i = 0; i < segs.length; i++) {
        const g = segs[i];
        if (t < g.e || i === segs.length - 1) return { ct: g.a + (g.b - g.a) * clamp((t - g.s) / (g.e - g.s), 0, 1), i };
      }
    },
    inv(ct) { // tempo do clip -> tempo do vídeo (primeira parte que o contém)
      for (const g of segs) if (ct >= g.a && ct <= g.b) return g.s + (ct - g.a) / (g.b - g.a) * (g.e - g.s);
      return null;
    }
  };
}

/* ---------- portátil e câmara ---------- */
const S0 = 0.86, LC = { x: 1010, y: 612 };
function camFor(rect, zmax = 1.9) {
  if (!rect) return { fx: 640, fy: 400, z: 1 };
  const [x, y, w, h] = rect;
  const z = clamp(Math.min(1500 / (w * S0), 780 / (h * S0)), 1, zmax);
  return { fx: x + w / 2, fy: y + h / 2, z };
}
function cameraAt(kfs, ct) {
  if (ct <= kfs[0].ct) return kfs[0].cam;
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    if (ct < b.ct) {
      const tr = Math.min(0.75, (b.ct - a.ct) * 0.6);
      const p = E.io(prog(ct, b.ct - tr, b.ct));
      return { fx: a.cam.fx + (b.cam.fx - a.cam.fx) * p, fy: a.cam.fy + (b.cam.fy - a.cam.fy) * p, z: a.cam.z + (b.cam.z - a.cam.z) * p };
    }
  }
  return kfs[kfs.length - 1].cam;
}
function placeLaptop(cam, extra = {}) {
  const s = S0 * cam.z * (extra.scale || 1);
  const x = LC.x - s * (18 + cam.fx) + (extra.dx || 0), y = LC.y - s * (22 + cam.fy) + (extra.dy || 0);
  css($('#laptop'), { transform: `translate(${x}px,${y}px) scale(${s})`, opacity: extra.op == null ? 1 : extra.op });
}

/* ---------- passos ---------- */
function stepCard(el, n, title, subs, subIdx, subT, x, y, t, tin, tout) {
  if (el.dataset.n !== String(n)) {
    el.dataset.n = n;
    el.querySelector('.n').textContent = n;
    el.querySelector('h2').textContent = title;
    el.querySelector('p').innerHTML = subs.map((s) => `<span>${s}</span>`).join('');
    el.querySelector('p').style.display = subs.some(Boolean) ? '' : 'none';
  }
  const a = prog(t, tin, tin + 0.5), b = prog(t, tout - 0.35, tout);
  show(el, t >= tin && t < tout);
  css(el, { left: x + 'px', top: y + 'px', opacity: E.out(a) * (1 - b), transform: `translateY(${(1 - E.back(a)) * 40 - b * 20}px)` });
  const spans = el.querySelectorAll('p span');
  spans.forEach((s, i) => {
    const on = i === subIdx;
    const since = on ? prog(t, subT, subT + 0.35) : 0;
    css(s, { opacity: on ? E.out(since) : 0, transform: `translateY(${on ? (1 - E.out(since)) * 14 : 0}px)` });
  });
}

/* ---------- confetti ---------- */
let CONF = [];
function confetti(t, t0, ox, oy) {
  const box = $('#confetti');
  if (!CONF.length) {
    let s = 7;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const cols = ['#c9402a', '#f2b134', '#2f9e6e', '#3b82f6', '#ff8a6b', '#8b5cf6'];
    for (let i = 0; i < 80; i++) {
      const d = document.createElement('div'); d.className = 'abs conf';
      d.style.background = cols[i % cols.length]; box.appendChild(d);
      const a = -Math.PI / 2 + (r() - 0.5) * 2.2;
      CONF.push({ d, vx: Math.cos(a) * (500 + r() * 900), vy: Math.sin(a) * (700 + r() * 900), sp: (r() - 0.5) * 1400, w: 0.6 + r() * 0.8 });
    }
  }
  const tau = t - t0;
  CONF.forEach((c) => {
    const on = tau >= 0 && tau < 2.4;
    show(c.d, on);
    if (!on) return;
    const x = ox + c.vx * tau * Math.exp(-tau * 0.6), y = oy + c.vy * tau + 0.5 * 1800 * tau * tau;
    css(c.d, { transform: `translate(${x}px,${y}px) rotate(${c.sp * tau}deg) scale(${c.w},1)`, opacity: 1 - prog(tau, 1.6, 2.4) });
  });
}

const CHAOS = [

function hook(t) {
  css($('#hookGlow'), { left: 260 + Math.sin(t * 0.8) * 60 + 'px', top: -120 + Math.cos(t * 0.6) * 40 + 'px' });
  const lines = [['#h1', 0.15, 2.45], ['#h2', 2.55, 3.85], ['#h3', 3.95, 5.35]];
  lines.forEach(([id, a, b]) => {
    const ws = $$(id + ' .w');
    ws.forEach((w, i) => {
      const s = a + i * 0.09, p = prog(t, s, s + 0.4), q = prog(t, b, b + 0.3);
      css(w, { opacity: E.out(p) * (1 - q), transform: `translateY(${(1 - E.back(p)) * 60 - q * 30}px) scale(${0.9 + 0.1 * E.out(p)})` });
    });
  });
  const implode = prog(t, 5.25, 5.85);
  $$('[data-c]').forEach((el, i) => {
    const P = CHAOS[i], s = 1.2 + i * 0.2, p = prog(t, s, s + 0.45);

    const fx = Math.sin(t * 1.3 + i * 1.7) * 10, fy = Math.cos(t * 1.1 + i) * 10;

    show(vf, u < 3.7); css(vf, { opacity: 1 - toPage });
    const lock = prog(u, 2.3, 2.5);
    [['#b1', 64, 172], ['#b2', 272, 172], ['#b3', 64, 474], ['#b4', 272, 474]].forEach(([id, bx, by], i) => {
      const k = 1 - E.out(lock) * 0.15, cx = 195, cy = 350;
      css($(id), { left: cx + (bx - cx) * k + 'px', top: cy + (by - cy) * k + 'px', borderColor: lock > 0.5 ? '#4ade80' : '#facc15' });
    });
    css($('#vfCard'), { transform: `scale(${1 + Math.sin(u * 2) * 0.01})` });
    const bn = prog(u, 2.55, 2.85), bo = prog(u, 3.3, 3.5);
    show(ban, u > 2.5 && u < 3.5);
    css(ban, { transform: `translateY(${(1 - E.back(bn)) * -140}px) scale(${1 - bo * 0.05})`, opacity: 1 - bo });
    const tp = prog(u, 3.15, 3.55);
    show($('#tap'), tp > 0 && tp < 1);
    css($('#tap'), { left: 160 + 'px', top: 80 + 'px', transform: `scale(${0.3 + tp * 1.6})`, opacity: 1 - tp });
    show(img, u >= 3.4);
    css(img, { opacity: E.out(toPage) });
    const ct = inMob ? MAP.mob.at(t).ct : CL.mob.m('start').t;
    if (u >= 3.3) showFrame(img, CL.mob, ct);

    if (inQr) {
      stepCard(B, 2, T.s2[0], [T.s2[1]], 0, 16.5, 1190, 380, t, 16.35, 22.05);
      css(B, { maxWidth: '660px' });
      show(A, false);
    } else {
      stepCard(B, 3, T.s3[0], [''], -1, 0, 1180, 300, t, 22.05, 32.2);
      css(B, { maxWidth: '660px' });
      show(A, false);
      const cvT = MAP.mob.inv(CL.mob.m('cv').t), sentT = MAP.mob.inv(CL.mob.m('sent').t);
      const times = [22.6, 23.4, cvT, sentT];
      $$('#checks .check').forEach((el, i) => {
        const q = prog(t, times[i], times[i] + 0.4);
        css(el, { opacity: E.out(q), transform: `translateX(${(1 - E.back(q)) * 60}px)` });
        css(el.querySelector('i'), { transform: `scale(${E.back(q)})` });
      });
      const sp = prog(t, sentT, sentT + 0.45);
      css($('#sentPill'), { left: 700 - 190 + 'px', top: 40 + 'px', opacity: E.out(sp) * (1 - prog(t, 31.6, 32)), transform: `scale(${0.4 + 0.6 * E.back(sp)})` });
      confetti(t, sentT, 690, 420);
    }
  } else { show($('#confetti'), false); }
  if (inMob) show($('#confetti'), true);

  if (inPanel) {
    const { ct, i } = MAP.panel.at(t);
    showFrame($('#lapImg'), CL.panel, ct);
    const e = prog(t, 34.0, 34.75);
    placeLaptop(cameraAt(CAM.panel, ct), { scale: 0.35 + 0.65 * E.out(e), op: E.out(prog(t, 34, 34.3)), dy: (1 - E.out(e)) * -200 });
    const seg = MAP.panel.segs[i];
    stepCard(A, 4, T.s4[0], T.s4subs, seg.sub, seg.s, 80, 60, t, 34.5, 48.2);
    show(B, false);
    const estSeg = MAP.panel.segs[4], ok = MAP.panel.inv(CL.panel.m('estadoOk').t) || estSeg.e - 1;
    const pa = prog(t, estSeg.s, estSeg.s + 0.4), pb = prog(t, estSeg.e - 0.1, estSeg.e + 0.2);
    css($('#pipe'), { opacity: E.out(pa) * (1 - pb), transform: `translateX(-50%) translateY(${(1 - E.out(pa)) * 60}px)` });
    $$('#pipe .p').forEach((el, k) => {
      const active = k === (t >= ok ? 3 : 0);
      css(el, { background: active ? '#c9402a' : '#f1ebe5', color: active ? '#fff' : '#57534e', transform: `scale(${active ? 1 + 0.12 * (1 - prog(t, ok, ok + 0.4)) * (t >= ok ? 1 : 0) + 0.04 : 1})` });
    });
  }
  if (!inVac && !inPanel) show(A, false);
  if (!inQr && !inMob) show(B, false);
}

function notif(t) {
  const u = t - 32;
  const d = prog(u, 0.1, 0.65), out = prog(u, 1.9, 2.5);
  css($('#nCard'), { top: -260 + (300 + 260) * E.back(d) - E.in(out) * 200 + 'px',
    transform: `scale(${1 - E.in(out) * 0.6}) translateX(${E.in(out) * 300}px)`, opacity: 1 - out });
  const tx = prog(u, 0.6, 1.0);
  css($('#nText'), { opacity: E.out(tx) * (1 - out), transform: `translateY(${(1 - E.out(tx)) * 40}px)` });
  $('#notif').style.opacity = 1 - prog(u, 2.1, 2.6);
}

function ben(t) {
  const u = t - 48;
  css($('#bb1'), { left: 1100 + Math.sin(u) * 100 + 'px', top: -300 + Math.cos(u * 0.8) * 80 + 'px' });
  const ti = prog(u, 0.25, 0.7);
  css($('#benTitle'), { opacity: E.out(ti), transform: `translateY(${(1 - E.out(ti)) * 50}px)` });
  $$('[data-b]').forEach((el, i) => {
    const q = prog(u, 0.5 + i * 0.6, 0.95 + i * 0.6);
    css(el, { left: 130 + i * 570 + 'px', opacity: E.out(q), transform: `translateY(${(1 - E.back(q)) * 120 + Math.sin(u * 1.5 + i) * 6}px) rotate(${(1 - E.out(q)) * (i - 1) * 6}deg)` });
  });
  const f = prog(u, 2.8, 3.15);
  css($('#free'), { opacity: E.out(f), transform: `translateX(-50%) scale(${(1.6 - 0.6 * E.out(f)) * (1 + Math.sin(Math.max(0, u - 3.2) * 4) * 0.012)})` });
}

function cta(t) {
  const u = t - 54;
  css($('#cb1'), { left: -100 + Math.sin(u * 0.6) * 80 + 'px', top: -200 + 'px' });
  css($('#cb2'), { left: 1400 + Math.cos(u * 0.5) * 80 + 'px', top: 600 + 'px' });
  const l = prog(u, 0.1, 0.6);
  css($('#ctaLogo'), { transform: `scale(${E.back(l)}) rotate(${(1 - E.out(l)) * 20}deg)`, opacity: Math.min(1, l * 3) });
  $$('#ctaTitle .w').forEach((w, i) => {
    const q = prog(u, 0.4 + i * 0.08, 0.85 + i * 0.08);
    css(w, { opacity: E.out(q), transform: `translateY(${(1 - E.back(q)) * 60}px)` });
  });
  const btn = $('#ctaBtn'), b = prog(u, 1.2, 1.6);
  const press = u > 3.0 && u < 3.25 ? 0.94 : 1;
  css(btn, { opacity: E.out(b), transform: `translateX(-50%) scale(${(0.5 + 0.5 * E.back(b)) * press * (1 + (u > 3.3 ? Math.sin((u - 3.3) * 4.5) * 0.025 : 0))})` });
  const bw = btn.offsetWidth, bh = btn.offsetHeight;
  ['#pl1', '#pl2'].forEach((id, i) => {
    const q = u > 3.3 + i * 0.6 ? ((u - 3.3 - i * 0.6) % 1.4) / 1.4 : -1;
    const g = q < 0 ? 0 : q * 40;
    css($(id), { left: 960 - bw / 2 - g + 'px', top: 640 - g + 'px', width: bw + g * 2 + 'px', height: bh + g * 2 + 'px', opacity: q < 0 ? 0 : (1 - q) * 0.7 });
  });
  const n = prog(u, 1.6, 2.0), r = prog(u, 1.9, 2.3);
  css($('#ctaNote'), { opacity: E.out(n), transform: `translateY(${(1 - E.out(n)) * 20}px)` });
  css($('#ctaUrl'), { opacity: E.out(r), transform: `translateY(${(1 - E.out(r)) * 20}px)` });
  // cursor que carrega no botão
  const cur = $('#cursor'), c = E.io(prog(u, 2.0, 2.95));
  const cx = 1500 + (1010 - 1500) * c, cy = 1000 + (700 - 1000) * c;
  css(cur, { display: u > 1.9 ? '' : 'none', transform: `translate(${cx}px,${cy}px) scale(${press < 1 ? 0.85 : 1})`, opacity: 1 - prog(u, 5.5, 6.0) });
  const rp = prog(u, 3.0, 3.6);
  css($('#ctaRipple'), { display: rp > 0 && rp < 1 ? '' : 'none', left: 1010 - 40 + 'px', top: 700 - 40 + 'px', transform: `scale(${0.3 + rp * 3})`, opacity: 1 - rp });
}

function wipes(t) {
  let best = null;
  for (const b of WIPES) if (t > b - 0.45 && t < b + 0.45) best = b;
  const w1 = $('#wipe1'), w2 = $('#wipe2');
  show(w1, !!best); show(w2, !!best);
  if (!best) return;
  const p = prog(t, best - 0.45, best + 0.45);
  const x1 = 1920 - E.io(p) * 4600, x2 = x1 + 260;
  css(w1, { transform: `translateX(${x1}px) skewX(-14deg)` });
  css(w2, { transform: `translateX(${x2 + 2600 * 0 - 120}px) skewX(-14deg)`, width: '160px' });
}

window.renderAt = async function (t) {
  pending = [];
  const on = (k) => t >= S[k][0] && t < S[k][1];
  show($('#hook'), on('hook')); show($('#logo'), on('logo'));
  show($('#app'), on('vac') || on('qr') || on('mob') || t >= 34 && t < 48);
  show($('#notif'), on('notif')); show($('#ben'), on('ben')); show($('#cta'), on('cta'));
  if (on('hook')) hook(t);
  if (on('logo')) logo(t);
  if (on('vac') || on('qr') || on('mob') || (t >= 34 && t < 48)) appScene(t);
  if (on('notif')) notif(t);
  if (on('ben')) ben(t);
  if (on('cta')) cta(t); else show($('#cursor'), false);
  wipes(t);
  await Promise.all(pending);
};
</script>
</body></html>
